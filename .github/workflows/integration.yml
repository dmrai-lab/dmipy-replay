name: Integration

# The mains of dmipy-replay, dmipy-sim, dmipy-fit, dmipy-design and dmipy-tract installed together and smoke-tested
# (dmrai-lab/.github, integration.yml), at this repository's commit on a push to main and on a pull request.
# A push to main tells dmipy-sim, dmipy-fit and dmipy-design; the notice needs the secret DMRAI_DISPATCH_TOKEN (see that workflow)
# and is skipped, with a notice in the run, without it.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    uses: dmrai-lab/.github/.github/workflows/integration.yml@main
    with:
      notify: dmipy-sim dmipy-fit dmipy-design
    secrets:
      DMRAI_DISPATCH_TOKEN: ${{ secrets.DMRAI_DISPATCH_TOKEN }}
