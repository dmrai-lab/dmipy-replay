name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # numpy is the whole dependency; safetensors is installed only as the oracle the container is checked against
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,oracle]" safetensors
      - name: Test
        run: pytest -q
