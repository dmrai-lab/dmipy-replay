name: Publish to PyPI

# A tag v<version> (the version in pyproject.toml) builds the sdist and the wheel, checks them and publishes them to
# PyPI through its trusted publisher for this repository and this workflow (no token is stored here).
on:
  push:
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
          test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - uses: pypa/gh-action-pypi-publish@release/v1
