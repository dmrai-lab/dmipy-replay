[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmipy-replay"
version = "0.1.0"
description = "The reader of Monte-Carlo diffusion-MRI replay packs: the Hub client, the replay, Pulseq, the grid layouts; numpy only"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{ name = "Rutger Fick", email = "fick.rutger@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
# 2.0 is the oldest numpy the test suite passes on (np.trapezoid is new in 2.0; the suite was run on numpy 2.0.0)
dependencies = ["numpy>=2.0"]

keywords = ["diffusion MRI", "Monte Carlo", "replay pack", "Pulseq", "simulation"]

[project.urls]
Homepage = "https://github.com/dmrai-lab/dmipy-replay"
Source = "https://github.com/dmrai-lab/dmipy-replay"
Specification = "https://github.com/dmrai-lab/replay-pack-spec"

[project.optional-dependencies]
test = ["pytest>=7.0", "safetensors>=0.4"]      # safetensors is the oracle the container is checked against

[tool.setuptools.packages.find]
include = ["dmipy_replay*"]

[tool.setuptools.package-data]
"dmipy_replay.acquisition" = ["*.json"]
"dmipy_replay.spec" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
